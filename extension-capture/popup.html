<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Export session</h1>
      <p class="sub">Admin tool: save a Grammarly JSON to assign on the website.</p>

      <div class="card">
        <p class="hint">
          Stay logged in at <code>app.grammarly.com</code> in this Chrome
          profile, then export. You can be on any tab.
        </p>
        <button id="exportBtn">Download session JSON</button>
      </div>

      <div class="card">
        <div id="status" class="status">Ready.</div>
      </div>
    </div>
    <script src="session.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
